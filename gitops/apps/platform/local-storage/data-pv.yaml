# The Asus /DATA partition (mounted by scripts/35-data-mount.sh). Capacity is nominal, not enforced.
# Claim it from any namespace with a PVC: storageClassName: local-data, volumeName: data-pv.
# Pods using it are scheduled onto the Asus automatically via nodeAffinity.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-pv
spec:
  capacity: {storage: 800Gi}
  accessModes: [ReadWriteOnce]       # one NODE; multiple pods on that node can mount it
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-data
  volumeMode: Filesystem
  local:
    path: /DATA
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: homelab/storage, operator: In, values: [media]}
