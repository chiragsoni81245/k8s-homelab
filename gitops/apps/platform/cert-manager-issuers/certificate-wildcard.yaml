# One wildcard certificate for every app: *.chiragsoni.org (one level: jellyfin.chiragsoni.org, not a.b.chiragsoni.org).
# Lives next to the Gateway that serves it. Starts on STAGING: once `kubectl -n envoy-gateway-system get certificate`
# shows READY=True, change issuerRef.name to letsencrypt-prod, commit, push (see docs/tls.md).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-chiragsoni-org
  namespace: envoy-gateway-system
spec:
  secretName: wildcard-chiragsoni-org
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
    - "*.chiragsoni.org"
  privateKey:
    rotationPolicy: Always
