name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck python3-yaml gettext-base jq
      - name: Lint + unit tests
        run: tests/run.sh
