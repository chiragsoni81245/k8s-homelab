# Shared by the setup.sh bootstrap install and Argo CD (single source of truth).
# k8sServiceHost MUST equal the control-plane endpoint chosen at `setup.sh` (checked by the script).
k8sServiceHost: k8s-api.homelab.chiragsoni.org
k8sServicePort: 6443
kubeProxyReplacement: true
# Restart the agents when cilium-config changes; otherwise edits here (e.g. devices) only apply after a manual restart.
rollOutCiliumPods: true
# Only the LAN NICs - NOT NetBird's wt0 (auto-detection picks it). With Cilium's eBPF on wt0, LoadBalancer-IP traffic
# from NetBird was taken by Cilium before NetBird's forward ACL and silently lost. See docs/networking.md.
devices: "en+,eth+"
ipam:
  mode: kubernetes          # use the per-node podCIDR assigned by kubeadm (10.244.0.0/16)
routingMode: tunnel
tunnelProtocol: vxlan
l2announcements:
  enabled: true             # answer ARP for LoadBalancer IPs on the LAN
k8sClientRateLimit:         # required headroom for L2 announcement leader election
  qps: 20
  burst: 100
prometheus:
  enabled: true             # agent metrics on :9962, scraped by apps/observability/victoria-metrics/scrapes.yaml
  metricsService: true      # headless Service cilium-agent for the scrape
operator:
  replicas: 1               # 2 nodes only
  prometheus:
    enabled: true           # operator metrics on :9963 (chart default, spelled out)
    metricsService: true    # headless Service cilium-operator for the scrape
# No Cilium L7 proxy: Envoy Gateway is the ingress, and there are no L7 network policies. Saves the cilium-envoy
# DaemonSet. Re-enable both for L7 CiliumNetworkPolicies or Hubble L7 visibility.
envoy:
  enabled: false
l7Proxy: false
hubble:
  enabled: false            # keep the 8GB Asus light; enable later via values
