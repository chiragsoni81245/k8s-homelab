# Alerts for the add-ons the default rules don't know about. Targets being down is already covered by the
# default TargetDown alert (job labels set in the vm*scrape-*.yaml files), pods/DaemonSets not ready by the kubernetes-apps rules.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: homelab-addons
  namespace: monitoring
spec:
  groups:
    - name: envoy-gateway
      rules:
        - alert: EnvoyBackendHigh5xxRate
          # only when the backend sees real traffic (> 0.1 req/s), so one failed request at night doesn't page
          expr: |
            (
              sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_response_code_class="5"}[5m]))
                /
              sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_total[5m]))
            ) > 0.05
            and
            sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_total[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'More than 5% 5xx responses from {{ $labels.envoy_cluster_name }}'
            description: '{{ $value | humanizePercentage }} of requests to {{ $labels.envoy_cluster_name }} failed with 5xx over the last 5m.'
        - alert: GatewayCertificateExpiringSoon
          # cert-manager renews 30 days before expiry, so under 14 days means renewal is failing
          expr: min by (pod) (envoy_server_days_until_first_cert_expiring) < 14
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 'Gateway TLS certificate expires in {{ $value }} days'
            description: 'Check the wildcard-chiragsoni-org Certificate (cert-manager-issuers app) and the cert-manager logs.'
    - name: cilium
      rules:
        - alert: CiliumHighDropRate
          # some drops are normal (e.g. unsupported L3 protocols); a sustained high rate usually means a routing/policy problem
          expr: sum by (pod, reason) (rate(cilium_drop_count_total[5m])) > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'Cilium on {{ $labels.pod }} drops {{ $value | humanize }} packets/s ({{ $labels.reason }})'
            description: 'Sustained packet drops. Check `kubectl -n kube-system exec ds/cilium -- cilium-dbg monitor --type drop`.'
    - name: proton-secrets-operator
      rules:
        - alert: ProtonSecretSyncFailing
          # failures with no successful sync at all in the window; a single bad ProtonSecret is shown by ProtonSecretStale
          expr: |
            sum(increase(protonsecret_reconcile_total{result!="success"}[15m])) > 0
            and
            (sum(increase(protonsecret_reconcile_total{result="success"}[15m])) or vector(0)) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'ProtonSecrets are failing to sync with Proton Pass'
            description: 'No successful sync in 15m. Check `kubectl get protonsecret -A`, the operator logs and whether the PAT is valid.'
        - alert: ProtonSecretStale
          expr: time() - protonsecret_last_sync_timestamp_seconds > 6 * 3600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'ProtonSecret {{ $labels.namespace }}/{{ $labels.name }} has not synced for 6h'
            description: 'Run `kubectl -n {{ $labels.namespace }} describe protonsecret {{ $labels.name }}` for the reason.'
        - alert: ProtonPATExpiringSoon
          # expires-at in the proton-pat Secret; 0 means unknown/not set and is ignored. Rotate: tools/create-proton-pat-secret.sh
          expr: |
            (protonsecret_pat_expiry_timestamp_seconds - time()) < 14 * 86400
            and
            protonsecret_pat_expiry_timestamp_seconds > 0
          labels:
            severity: critical
          annotations:
            summary: 'The Proton Pass personal access token expires in {{ $value | humanizeDuration }}'
            description: 'Create a new PAT and run tools/create-proton-pat-secret.sh; every ProtonSecret stops syncing once it expires.'
