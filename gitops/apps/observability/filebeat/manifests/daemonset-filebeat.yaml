# Filebeat DaemonSet (one per node): tails /var/log/containers/*.log (containerd's per-pod logs), adds Kubernetes
# metadata (namespace, pod, container, node, labels) and sends it to VictoriaLogs' Elasticsearch-compatible API.
# Based on Elastic's filebeat-kubernetes.yaml (v9.5.5) and docs.victoriametrics.com/victorialogs/data-ingestion/filebeat/.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: monitoring
  labels:
    k8s-app: filebeat
spec:
  selector:
    matchLabels:
      k8s-app: filebeat
  template:
    metadata:
      labels:
        k8s-app: filebeat
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat-wolfi:9.5.5   # pinned
          args:
            - -c
            - /etc/filebeat.yml
            - -e
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0           # read the root-owned container logs
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              memory: 300Mi
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat.yml
              subPath: filebeat.yml
              readOnly: true
            - name: data
              mountPath: /usr/share/filebeat/data
            - name: varlog
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: filebeat-config
            defaultMode: 0640
        - name: varlog
          hostPath:
            path: /var/log         # /var/log/containers -> /var/log/pods (containerd)
        # registry of read positions, so a restart doesn't resend everything
        - name: data
          hostPath:
            path: /var/lib/filebeat-data
            type: DirectoryOrCreate
