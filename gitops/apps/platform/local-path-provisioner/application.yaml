# Dynamic small volumes (app configs/DBs). Created on whichever node the pod lands on;
# pin pods that need the SSD with nodeSelector homelab/disk=ssd.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path-provisioner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  sources:
    - repoURL: https://github.com/rancher/local-path-provisioner.git
      path: deploy/chart/local-path-provisioner
      targetRevision: v0.0.37   # pinned git tag
      helm:
        valueFiles:
          - $values/gitops/apps/platform/local-path-provisioner/values.yaml
    - repoURL: https://github.com/chiragsoni81245/k8s-homelab.git # homelab-repo
      targetRevision: main # homelab-revision
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
