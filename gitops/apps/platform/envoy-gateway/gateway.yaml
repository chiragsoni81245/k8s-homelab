# Shared entry point. The Envoy Service gets a fixed LAN IP from the Cilium pool (L2-announced).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: homelab
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # One Envoy per node (DaemonSet instead of the default single-replica Deployment). With externalTrafficPolicy
      # Local, Cilium only hands .200 traffic to an Envoy on the node that received it, i.e. the node announcing .200
      # (pinned to the Asus in cilium/l2-announcement.yaml). The other Envoys serve nothing external but are ready
      # if that pin changes.
      envoyDaemonSet: {}
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local   # Envoy Gateway's default, spelled out: keeps the real client IP
        annotations:
          lbipam.cilium.io/ips: 192.168.0.200
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: homelab
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: envoy
  listeners:
    # HTTPS only, enforced here for every app: port 80 just redirects (route `https-redirect` below). `from: Same`
    # means app routes (other namespaces) can't attach to it, so a route with no sectionName lands on `https` only.
    # (Certificates use DNS-01, so port 80 isn't needed for ACME.)
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.chiragsoni.org"
      tls:
        mode: Terminate
        certificateRefs:
          # group/kind spelled out: the API server defaults them, which would show up as an Argo diff
          # issued by cert-manager (cert-manager-issuers app)
          - group: ''
            kind: Secret
            name: wildcard-chiragsoni-org
      allowedRoutes:
        namespaces:
          from: All
---
# Every plain-HTTP request (any host, any path) -> 301 to the same URL on https.
# matches spelled out: the API server defaults them, which would show up as an Argo diff.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: envoy-gateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
