apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # after cert-manager (operator webhook cert)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts
      chart: victoria-metrics-k8s-stack
      targetRevision: 0.96.0   # pinned (VictoriaMetrics v1.154.0, operator v0.75.0)
      helm:
        valueFiles:
          - $values/gitops/apps/observability/victoria-metrics/values.yaml
    - repoURL: https://github.com/chiragsoni81245/k8s-homelab.git # homelab-repo
      targetRevision: main # homelab-revision
      ref: values
    - repoURL: https://github.com/chiragsoni81245/k8s-homelab.git # homelab-repo
      targetRevision: main # homelab-revision
      path: gitops/apps/observability/victoria-metrics
      # Cilium/Envoy scrapes, add-on alerts, routes
      directory:
        include: '{scrapes,rules,httproute}.yaml'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true                   # VM CRDs are too large for client-side apply
      - SkipDryRunOnMissingResource=true       # scrapes/rules use CRDs installed by this same app
