# Both issuers solve DNS-01 through Cloudflare using the Secret `cloudflare-api-token` (key `api-token`) in the
# cert-manager namespace. That Secret is NOT in git: create it with tools/create-cloudflare-secret.sh.
# Staging issues untrusted certs but has generous rate limits - use it to prove the setup, then switch to prod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: chiragsoni81245@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - selector:
          dnsZones:
            - chiragsoni.org
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
