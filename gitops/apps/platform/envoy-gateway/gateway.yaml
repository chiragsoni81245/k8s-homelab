# Shared entry point. The Envoy Service gets a fixed LAN IP from the Cilium pool (L2-announced).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: homelab
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # One Envoy per node (DaemonSet instead of the default single-replica Deployment). With externalTrafficPolicy
      # Local, Cilium only hands .200 traffic to an Envoy on the node that received it - LAN traffic lands on the
      # L2-leader node, NetBird traffic on the routing peer (Cilium's eBPF also runs on wt0). Every node needs one.
      envoyDaemonSet: {}
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local   # Envoy Gateway's default, spelled out: keeps the real client IP
        annotations:
          lbipam.cilium.io/ips: 192.168.0.200
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: homelab
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.chiragsoni.org"
      tls:
        mode: Terminate
        certificateRefs:
          # group/kind spelled out: the API server defaults them, which would show up as an Argo diff
          # issued by cert-manager (cert-manager-issuers app)
          - group: ''
            kind: Secret
            name: wildcard-chiragsoni-org
      allowedRoutes:
        namespaces:
          from: All
