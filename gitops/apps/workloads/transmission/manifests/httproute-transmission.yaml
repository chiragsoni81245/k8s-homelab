# transmission.chiragsoni.org through Envoy Gateway on 192.168.0.200 (HTTPS only). No login: LAN/NetBird-only.
# Own route instead of the chart's httpRoute (that one omits backendRefs group/kind -> permanent Argo diff).
# group/kind/weight/matches spelled out: the API server defaults them, which would show up as an Argo diff.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: transmission
  namespace: transmission
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: envoy-gateway-system
  hostnames:
    - transmission.chiragsoni.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: transmission
          port: 9091
          weight: 1
