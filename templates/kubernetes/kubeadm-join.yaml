# Rendered by scripts/60-worker-join.sh. Variables: CONTROL_PLANE_ENDPOINT JOIN_TOKEN CA_VERIFY
#   NODE_NAME NODE_IP NODE_LABELS
apiVersion: kubeadm.k8s.io/v1beta4
kind: JoinConfiguration
discovery:
  bootstrapToken:
    apiServerEndpoint: "${CONTROL_PLANE_ENDPOINT}:6443"
    token: "${JOIN_TOKEN}"
    ${CA_VERIFY}
nodeRegistration:
  name: ${NODE_NAME}
  kubeletExtraArgs:
    - name: node-ip
      value: "${NODE_IP}"
    - name: node-labels
      value: "${NODE_LABELS}"
