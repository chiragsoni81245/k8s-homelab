# StorageClass for static local volumes. Each app declares its OWN PersistentVolume + claim
# (see workloads/jellyfin for the pattern); nothing here points at a specific folder.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  source:
    repoURL: https://github.com/chiragsoni81245/k8s-homelab.git # homelab-repo
    targetRevision: main # homelab-revision
    path: gitops/apps/platform/local-storage/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
