# Secret netbird/netbird-setup-key (key: setup-key) from Proton Pass: login item "netbird-router" in vault "homelab",
# the setup key stored as its password. rolloutTargets restarts the router when the key changes (read only at start).
apiVersion: proton-secrets.io/v1alpha1
kind: ProtonSecret
metadata:
  name: netbird-setup-key
  namespace: netbird
spec:
  refreshInterval: 1h
  target:
    name: netbird-setup-key
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: setup-key
      remoteRef: pass://homelab/netbird-router/password
  rolloutTargets:
    - kind: Deployment
      name: netbird-router
