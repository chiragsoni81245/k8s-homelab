# VictoriaMetrics cluster + monitoring stack. Chart: https://github.com/VictoriaMetrics/helm-charts (victoria-metrics-k8s-stack)
#
# What runs (namespace monitoring):
#   operator             turns the VM* custom resources below into StatefulSets/Deployments
#   VMCluster            vmstorage x2 (one per node, 5Gi local-path each, replicationFactor 2) + vminsert + vmselect (vmui)
#   vmagent              scrapes everything, writes to vminsert
#   vmalert + alertmanager   default rules + manifests/vmrule-homelab-addons.yaml; NO receiver yet (alerts only show in the UIs)
#   grafana              dashboards (synced from upstream at deploy time by the chart's sync-job)
#   node-exporter (both nodes), kube-state-metrics
# Extra scrapes for Cilium and Envoy Gateway, add-on alerts and routes: manifests/ (one resource per file).
#
# ONE-TIME, before the first sync (Grafana admin login, never stored in git):
#   sudo tools/create-grafana-secret.sh        (creates monitoring/grafana-admin; empty password prompt = generate one)

# Short resource names (vmstorage-vm, vmselect-vm, ...) instead of <release>-victoria-metrics-k8s-stack
fullnameOverride: vm

victoria-metrics-operator:
  admissionWebhooks:
    certManager:
      enabled: true          # webhook cert from cert-manager instead of a self-signed one regenerated on every render
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

vmsingle:
  enabled: false

# VictoriaLogs (single node) - pod logs shipped by Filebeat (apps/observability/filebeat). Query in Grafana
# (data source "VictoriaLogs (DS)") or its own UI: kubectl -n monitoring port-forward svc/vlsingle-vm 9428 -> /select/vmui/
vlsingle:
  enabled: true
  spec:
    retentionPeriod: "7d"
    storage:
      storageClassName: local-path   # root disk of whichever node it lands on; size nominal, not enforced
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
    extraArgs:
      retention.maxDiskSpaceUsageBytes: 9GiB   # drop the oldest logs before the 10Gi is exceeded
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

vmcluster:
  enabled: true
  spec:
    retentionPeriod: "7d"
    replicationFactor: 1     # every sample is kept on both vmstorage pods, so one node can be down
    vmstorage:
      replicaCount: 1        # one per node (affinity below); each one's volume then pins it to that node
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vmstorage
                  app.kubernetes.io/instance: vm
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path   # /var/lib/local-path on each node's root disk; size is nominal, not enforced
            resources:
              requests:
                storage: 5Gi
      extraArgs:
        storage.minFreeDiskSpaceBytes: 1GB # go read-only before the root disk fills up
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
    vmselect:
      replicaCount: 1
      storage: null          # query cache on emptyDir (there is no default StorageClass)
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    vminsert:
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi

vmagent:
  spec:
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

vmalert:
  spec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi

alertmanager:
  spec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  # Add a receiver here later (ntfy / Telegram / email); until then alerts are only visible in the Alertmanager UI.
  config:
    route:
      receiver: blackhole
    receivers:
      - name: blackhole

grafana:
  # Data source plugin for VictoriaLogs (downloaded from grafana.com at pod start); the chart then provisions
  # "VictoriaLogs (DS)" pointing at vlsingle.
  plugins:
    - victoriametrics-logs-datasource@0.33.1
  admin:
    existingSecret: grafana-admin   # created by hand, see the top of this file
  persistence:
    enabled: false           # dashboards and datasources come from git; changes made only in the UI are lost on restart
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  # The chart's two filesystem args (copied: a list replaces the default) + the drm collector for AMD GPU busy %/VRAM/GTT
  # (node_drm_*). GPU temperature/power come from the hwmon collector (on by default, chip_name="amdgpu").
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
    - --collector.drm
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi

# Control-plane components bind to 127.0.0.1 under kubeadm (unreachable from vmagent); kube-proxy is replaced by Cilium.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  groups:
    etcd:
      enabled: false         # not tied to kubeEtcd.enabled like the scheduler/controller-manager groups

# Extra Grafana dashboards, pinned to the installed versions (fetched by the sync-job like the defaults)
defaultDashboards:
  sources:
    cilium-agent:
      url: https://raw.githubusercontent.com/cilium/cilium/v1.20.3/install/kubernetes/cilium/files/cilium-agent/dashboards/cilium-dashboard.json
    cilium-operator:
      url: https://raw.githubusercontent.com/cilium/cilium/v1.20.3/install/kubernetes/cilium/files/cilium-operator/dashboards/cilium-operator-dashboard.json
    envoy-gateway-global:
      url: https://raw.githubusercontent.com/envoyproxy/gateway/v1.9.2/charts/gateway-addons-helm/dashboards/envoy-gateway-global.json
    envoy-proxy-global:
      url: https://raw.githubusercontent.com/envoyproxy/gateway/v1.9.2/charts/gateway-addons-helm/dashboards/envoy-proxy-global.json
    envoy-clusters:
      url: https://raw.githubusercontent.com/envoyproxy/gateway/v1.9.2/charts/gateway-addons-helm/dashboards/envoy-clusters.json
    # Our own, from this repo (dashboards/amd-gpu.json). Fetched from the public main branch at sync time - change the
    # URL if you fork or make the repo private.
    amd-gpu:
      url: https://raw.githubusercontent.com/chiragsoni81245/k8s-homelab/main/gitops/apps/observability/victoria-metrics/dashboards/amd-gpu.json
