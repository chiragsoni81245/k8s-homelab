apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  sources:
    - repoURL: https://jellyfin.github.io/jellyfin-helm
      chart: jellyfin
      targetRevision: 3.2.0   # pinned (app 10.11.8)
      helm:
        valueFiles:
          - $values/gitops/apps/workloads/jellyfin/values.yaml
    - repoURL: https://github.com/chiragsoni81245/k8s-homelab.git # homelab-repo
      targetRevision: main # homelab-revision
      ref: values
    - repoURL: https://github.com/chiragsoni81245/k8s-homelab.git # homelab-repo
      targetRevision: main # homelab-revision
      path: gitops/apps/workloads/jellyfin
      # this app's own volumes + claims
      directory:
        include: '{pv,pvc}.yaml'
  # The chart renders the HTTPRoute backendRefs without these fields; the API server fills in the defaults,
  # which Argo would otherwise show as a permanent diff.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .spec.rules[].backendRefs[].group
        - .spec.rules[].backendRefs[].kind
        - .spec.rules[].backendRefs[].weight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
