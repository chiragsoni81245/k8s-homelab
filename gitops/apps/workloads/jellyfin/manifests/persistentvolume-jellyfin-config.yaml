# Jellyfin's own volumes. `local` PVs need the folder to EXIST already (see values.yaml for the one-time mkdir).
# Both are pinned to the node that has /DATA mounted (label homelab/storage=media, set by setup.sh on any node - master or worker - with /DATA).
# Capacity is nominal (not enforced). Retain + local = deleting these objects never touches your files.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-config
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-data
  volumeMode: Filesystem
  local:
    path: /DATA/AppData/jellyfin-k8s
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: homelab/storage
              operator: In
              values:
                - media
