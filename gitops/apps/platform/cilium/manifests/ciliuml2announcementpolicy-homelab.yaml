apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab
spec:
  # No nodeSelector: any node may answer ARP for an LB IP. The Services here use externalTrafficPolicy: Local, and
  # Cilium only lets a node announce such a Service if it runs one of its pods - so .200 follows Envoy and .201
  # follows Samba, wherever they are scheduled. NetBird reaches these IPs through the in-cluster k8s-router pod.
  loadBalancerIPs: true
  # No `interfaces` list on purpose: every interface of the announcing node answers, so nothing here
  # depends on how the NICs are named (enp0s3, eno1, eth0, ...).
