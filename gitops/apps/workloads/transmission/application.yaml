apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: transmission
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: transmission
  sources:
    - repoURL: ghcr.io/lexfrei/charts      # OCI chart repo, registered in argocd/values.yaml (lexfrei-oci)
      chart: transmission
      targetRevision: 1.8.0   # pinned (Transmission 4.1.3, linuxserver image)
      helm:
        valueFiles:
          - $values/gitops/apps/workloads/transmission/values.yaml
    - repoURL: https://github.com/chiragsoni81245/k8s-homelab.git # homelab-repo
      targetRevision: main # homelab-revision
      ref: values
    - repoURL: https://github.com/chiragsoni81245/k8s-homelab.git # homelab-repo
      targetRevision: main # homelab-revision
      path: gitops/apps/workloads/transmission/manifests
      # plain manifests: this app's own volumes + claims, route
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
