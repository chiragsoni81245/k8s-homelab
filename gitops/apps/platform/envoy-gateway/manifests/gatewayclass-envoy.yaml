# Envoy Gateway's class, parameterised by envoyproxy-homelab.yaml (LB IP, DaemonSet).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
  annotations:
    # After the EnvoyProxy (wave 1): in the same wave the class is checked before its parametersRef exists, is marked
    # InvalidParameters and never re-checked, and Argo then waits on that "failed" class forever.
    argocd.argoproj.io/sync-wave: "2"
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: homelab
    namespace: envoy-gateway-system
