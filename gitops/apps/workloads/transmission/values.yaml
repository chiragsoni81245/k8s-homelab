# Transmission on the Asus. Chart: https://github.com/lexfrei/charts (linuxserver/transmission image)
#
# Volumes (declared in manifests/, both on the /DATA partition):
#   /downloads <- /DATA/Downloads/Torrent             finished + incomplete torrents
#   /config    <- /DATA/AppData/transmission-k8s      settings.json, torrent list/resume data (survives rebuilds)
#
# ONE-TIME, on the Asus (local PVs need the folders to exist; owned by the user below):
#   sudo mkdir -p /DATA/Downloads/Torrent /DATA/AppData/transmission-k8s
#   sudo chown 1000:1000 /DATA/AppData/transmission-k8s      # and check /DATA/Downloads/Torrent: stat -c '%u:%g'
#
# Web UI: https://transmission.chiragsoni.org (route in manifests/). NO authentication (USER/PASS unset):
# reachable from the LAN and NetBird only - keep it that way.

env:
  # Run as the owner of your files. CHECK: `stat -c '%u:%g' /DATA/Downloads/Torrent` on the Asus.
  PUID: "1000"
  PGID: "1000"
  TZ: Asia/Kolkata
  # Transmission rejects requests whose Host header isn't whitelisted (DNS-rebinding protection)
  HOST_WHITELIST: transmission.chiragsoni.org
  # ...and requests from addresses that aren't in its IP whitelist (default: 127.0.0.1 only). Envoy Gateway forwards
  # every request from its own POD address, so the pod network must be allowed. 10.244.*.* = POD_CIDR 10.244.0.0/16
  # (the setup default); if you changed POD_CIDR, change this to match. The UI is still only reachable from the
  # LAN/NetBird through the Gateway; this just lets the Gateway's proxy talk to Transmission.
  # WHITELIST REPLACES the default list, so loopback must be repeated: the chart's liveness probe runs
  # `curl http://localhost:9091/...` inside the pod (source 127.0.0.1); without it every probe gets a 403 and the
  # kubelet kills the container (exit 137, CrashLoopBackOff).
  WHITELIST: "127.0.0.1,::1,10.244.*.*"

# No fsGroup: it would make the kubelet chown the whole downloads folder recursively on every start
podSecurityContext:
  fsGroup: null

# The image's init scripts start as root and edit /config/settings.json (this is how WHITELIST/HOST_WHITELIST are
# applied) before dropping to PUID/PGID. The chart drops ALL capabilities, and root without DAC_OVERRIDE cannot
# write a file owned by someone else, so once /config belongs to 1000 the edits fail with "Permission denied" and
# Transmission keeps its default whitelist (127.0.0.1 only). DAC_OVERRIDE + FOWNER fix that. A Helm list replaces
# the chart's default, so the three original capabilities are repeated here.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
    add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

# Pinned to the Asus (where /DATA is); the PVs' nodeAffinity says the same
nodeSelector:
  homelab/storage: media

persistence:
  config:
    existingClaim: transmission-config
  downloads:
    type: pvc                     # required by the chart with existingClaim
    existingClaim: transmission-downloads

service:
  torrent:
    # No LoadBalancer for the peer port: nothing is port-forwarded from the internet (docs/networking.md), so it
    # would only take a LAN IP from the Cilium pool. Downloads work outbound; enable + port-forward for more peers.
    enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  # Asus has 8GB; no CPU limit so hashing/verifying isn't throttled
  limits:
    cpu: null
    memory: 512Mi
