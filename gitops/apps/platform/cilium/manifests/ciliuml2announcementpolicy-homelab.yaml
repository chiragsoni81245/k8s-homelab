apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab
spec:
  # Only the Asus answers ARP for LB IPs, so the NetBird routing peer (Dell) always forwards them over the LAN
  # instead of to itself (a node can't ARP-resolve its own announced IP). See docs/networking.md.
  nodeSelector:
    matchLabels:
      homelab/storage: media
  loadBalancerIPs: true
  # No `interfaces` list on purpose: every interface of the announcing node answers, so nothing here
  # depends on how the NICs are named (enp0s3, eno1, eth0, ...).
