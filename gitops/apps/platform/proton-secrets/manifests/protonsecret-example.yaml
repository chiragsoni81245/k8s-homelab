# DUMMY: proves the pipeline end to end. Create a Proton Pass vault "homelab" with an item "dummy" that has a
# "password" field, then check:  kubectl -n proton-secrets-system get protonsecret,secret example
# Replace/remove once real secrets (grafana-admin, cloudflare, samba) are migrated.
apiVersion: proton.chiragsoni.org/v1alpha1
kind: ProtonSecret
metadata:
  name: example
  namespace: proton-secrets-system
spec:
  refreshInterval: 1h
  target:
    name: example
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: password
      remoteRef: pass://homelab/dummy/password
