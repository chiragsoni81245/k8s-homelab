# proton-secrets-operator (apps/platform/proton-secrets-operator): reconcile results, sync duration, last-sync time per
# ProtonSecret, PAT expiry and the pass-cli version. The metrics endpoint is HTTPS with Kubernetes authn/authz, so vmagent
# sends its ServiceAccount token (its ClusterRole must allow `get` on the non-resource URL /metrics) and skips verification
# of the operator's self-signed certificate.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: proton-secrets-operator
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - proton-secrets-system
  selector:
    matchLabels:
      app.kubernetes.io/name: proton-secrets-operator
      app.kubernetes.io/part-of: proton-secrets-operator
  endpoints:
    - port: metrics
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true
      relabelConfigs:
        - targetLabel: job
          replacement: proton-secrets-operator
