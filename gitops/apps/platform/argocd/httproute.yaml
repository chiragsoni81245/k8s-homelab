# Argo CD UI/API through Envoy Gateway on 192.168.0.200 (TLS terminated there; argocd-server serves plain HTTP,
# configs.params server.insecure in values.yaml). CLI: `argocd login argocd.chiragsoni.org --grpc-web`.
# Kept out of values.yaml (server.httproute): setup.sh helm-installs Argo CD from values.yaml before the Gateway API
# CRDs exist, and the chart doesn't check for them. group/kind/weight/matches spelled out to avoid Argo diffs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: envoy-gateway-system
  hostnames:
    - argocd.chiragsoni.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
