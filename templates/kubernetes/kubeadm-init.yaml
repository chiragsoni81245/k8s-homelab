# Rendered by scripts/50-master-init.sh. Variables: MASTER_IP NODE_NAME NODE_LABELS K8S_VERSION
#   CONTROL_PLANE_ENDPOINT POD_CIDR SERVICE_CIDR APISERVER_EXTRA
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: ${MASTER_IP}
  bindPort: 6443
nodeRegistration:
  name: ${NODE_NAME}
  taints: []                      # no control-plane taint => the master also runs workloads
  kubeletExtraArgs:
    - name: node-ip
      value: "${MASTER_IP}"
    - name: node-labels
      value: "${NODE_LABELS}"
skipPhases:
  - addon/kube-proxy              # Cilium replaces kube-proxy
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: v${K8S_VERSION}
controlPlaneEndpoint: "${CONTROL_PLANE_ENDPOINT}:6443"
networking:
  podSubnet: ${POD_CIDR}
  serviceSubnet: ${SERVICE_CIDR}
apiServer:
  certSANs:
    - ${CONTROL_PLANE_ENDPOINT}
    - ${MASTER_IP}
    - ${NODE_NAME}
${APISERVER_EXTRA}
---
# Sized for a single 8GB / 100GB node that runs the control plane AND every app. Reserving memory for the OS and
# kubelet/containerd lowers the pods' allocatable, so the scheduler stops placing pods before the host itself runs
# short, and the kubelet evicts pods (lowest priority first) before the kernel OOM killer hits etcd/apiserver.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
systemReserved:
  cpu: 200m
  memory: 512Mi
kubeReserved:
  cpu: 200m
  memory: 512Mi
# All four signals spelled out: setting evictionHard replaces the whole default map.
evictionHard:
  memory.available: 300Mi
  nodefs.available: 10%
  nodefs.inodesFree: 5%
  imagefs.available: 10%
# Container log rotation (per container): 10Mi x 3 files
containerLogMaxSize: 10Mi
containerLogMaxFiles: 3
