# Installed by scripts/20-system-prep.sh only when the root disk is a spinning HDD (see tune_for_hdd).
# Keeps the system journal in RAM instead of writing it to the disk. Trade-off: host logs (kubelet, containerd,
# sshd, ...) are lost on reboot. Container logs are unaffected (files under /var/log/pods, shipped to VictoriaLogs).
[Journal]
Storage=volatile
RuntimeMaxUse=256M
