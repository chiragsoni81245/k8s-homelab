# Argo CD manages itself once bootstrapped by setup.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.10.5   # pinned; setup.sh bootstrap reads this same value
      helm:
        valueFiles:
          - $values/gitops/apps/platform/argocd/values.yaml
    - repoURL: https://github.com/chiragsoni81245/k8s-homelab.git # homelab-repo
      targetRevision: main # homelab-revision
      ref: values
    - repoURL: https://github.com/chiragsoni81245/k8s-homelab.git # homelab-repo
      targetRevision: main # homelab-revision
      path: gitops/apps/platform/argocd/manifests
      # plain manifests (argocd.chiragsoni.org route; needs the Gateway API CRDs from the envoy-gateway app)
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true   # fresh install: HTTPRoute CRD arrives later with envoy-gateway (wave 2)
    retry:
      limit: 10                            # ...so keep retrying until it exists
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
