apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media
  namespace: jellyfin
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-data
  volumeName: jellyfin-media
  resources:
    requests:
      storage: 800Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: jellyfin
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-data
  volumeName: jellyfin-config
  resources:
    requests:
      storage: 10Gi
