# Trimmed for a 2-node homelab. TLS is terminated at Envoy Gateway (manifests/httproute-argocd-server.yaml), so serve plain HTTP.
global:
  domain: argocd.chiragsoni.org
configs:
  params:
    server.insecure: true
  repositories:
    # Envoy Gateway's chart is an OCI artifact on Docker Hub; Argo needs it registered.
    envoyproxy-oci:
      name: envoyproxy
      type: helm
      url: docker.io/envoyproxy
      enableOCI: "true"
    # Transmission chart (apps/workloads/transmission), OCI on GitHub Container Registry (public, no credentials)
    lexfrei-oci:
      name: lexfrei
      type: helm
      url: ghcr.io/lexfrei/charts
      enableOCI: "true"
dex:
  enabled: false
notifications:
  enabled: false
