# IPs Cilium may hand to Services of type LoadBalancer. Reserve this range on the TP-Link router
# (outside its DHCP pool) so no other device takes these addresses.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: homelab
spec:
  blocks:
    - start: 192.168.0.200
      stop: 192.168.0.220
