# Values for charts/proton-secrets-operator (see the chart's values.yaml for every option).

image:
  repository: ghcr.io/chiragsoni81245/proton-secrets-operator
  # Pinned to a release, the same one as the chart (targetRevision in application.yaml) - bump both together.
  # Never "latest": the chart's pullPolicy is IfNotPresent, so a moving tag keeps the node's cached old image.
  tag: "v1.0.0"

# Single-node cluster: one replica (leader election stays on, so raising this later just works).
replicaCount: 1

# Soft spread: prefers different nodes if more are ever added, but never leaves a replica Pending on one node
# (DoNotSchedule would). Setting this replaces the chart default, so the selector is spelled out; the instance
# label is the Helm release name = the Argo Application name.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: proton-secrets-operator
        app.kubernetes.io/instance: proton-secrets-operator

pat:
  existingSecret: proton-pat   # created by tools/create-proton-pat-secret.sh
  key: token

# Bump the pass-cli version here without rebuilding the operator image. Empty = use the bundled one.
passCli:
  image:
    repository: ""
    tag: ""
  keyProvider: fs

# Scraping and alert rules are defined in the victoria-metrics app (vmservicescrape-proton-secrets-operator.yaml,
# vmrule-homelab-addons.yaml), so the chart's own PrometheusRule stays off.
metrics:
  enabled: true
  rules:
    enabled: false

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
