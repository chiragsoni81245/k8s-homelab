# One wildcard certificate for every app: *.chiragsoni.org (one level: jellyfin.chiragsoni.org, not a.b.chiragsoni.org).
# Lives next to the Gateway that serves it. Staging was proven first; this now uses the trusted production issuer.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-chiragsoni-org
  namespace: envoy-gateway-system
spec:
  secretName: wildcard-chiragsoni-org
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.chiragsoni.org"
  privateKey:
    rotationPolicy: Always
